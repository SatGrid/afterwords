name: Publish constellation

on:
  push:
    branches: [main]
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.label.name == 'approved-word'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add approved word
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/add_word.py
      - name: Save new word
        if: github.event_name == 'issues'
        run: |
          if git diff --quiet -- words.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.json
          git commit -m "Add approved word from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
      - name: Prepare site files
        run: |
          mkdir site
          cp index.html style.css app.js words.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
